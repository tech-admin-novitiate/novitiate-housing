name: Build and Deploy

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --force

      - name: Build Production Assets
        run: npm run build

      - name: Route Staging vs Live
        id: target-dir
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "Targeting PRODUCTION (Live site)"
            echo "dir=/public_html/" >> $GITHUB_OUTPUT
          else
            echo "Targeting STAGING (Subdomain)"
            echo "dir=/public_html/staging/" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.target-dir.outputs.dir }}
